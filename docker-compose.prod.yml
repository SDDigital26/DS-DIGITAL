# DS DIGITAL — production на VPS (только web, БД — внешняя Supabase)
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# Перед запуском создайте .env из .env.example (DATABASE_URL_DOCKER и NEXT_PUBLIC_SITE_URL).
services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-}
      EMAIL_API_ENDPOINT: ${EMAIL_API_ENDPOINT:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      CRON_SECRET: ${CRON_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
