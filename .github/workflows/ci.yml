name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Сгенерированный Prisma-клиент не в репозитории — генерируем без БД
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

  # G4: контроль бюджета JS главной страницы (gzip).
  # Замер идёт по задеплоенному сайту, поэтому шаг информационный:
  # при недоступности продакшена пайплайн не должен ломаться.
  perf-budget:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run perf:budget
        env:
          JS_BUDGET_KB: "230"
